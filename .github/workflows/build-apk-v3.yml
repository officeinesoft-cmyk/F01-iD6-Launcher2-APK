name: Build F01 iD6 APK V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK V3
        run: gradle assembleDebug

      - name: Rename APK V3
        run: cp app/build/outputs/apk/debug/app-debug.apk F01_iD6_Launcher_V3_1280x480.apk

      - name: Upload APK V3
        uses: actions/upload-artifact@v4
        with:
          name: F01-iD6-Launcher-V3-APK
          path: F01_iD6_Launcher_V3_1280x480.apk
