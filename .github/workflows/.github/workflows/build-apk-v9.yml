name: Build F01 Custom Launcher V9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK V9
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk F01_Custom_Launcher_V9_1280x480.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F01-Custom-Launcher-V9-APK
          path: F01_Custom_Launcher_V9_1280x480.apk
