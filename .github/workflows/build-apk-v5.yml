name: Build F01 iDrive Diagnostic V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build V5
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk F01_iDrive_Diagnostic_V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F01-iDrive-Diagnostic-V5-APK
          path: F01_iDrive_Diagnostic_V5.apk
